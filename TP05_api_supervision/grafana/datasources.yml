apiVersion: 1

datasources:
  - name: Steam API - PostgreSQL
    uid: steam-api-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: grafana_reader
    editable: false
    isDefault: false
    version: 1
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
    jsonData:
      database: steam_api
      sslmode: disable
      postgresVersion: 1800
      timescaledb: false
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 300
